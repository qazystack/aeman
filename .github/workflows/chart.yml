name: Chart

# The Helm chart under charts/aeman: `helm lint` and `helm template` with the
# default values and every ci/*-values.yaml, plus the checks of what the
# rendering must and must not contain (charts/test.sh). Kept apart from
# ci.yml so a chart change does not rebuild the binary and the reverse.
on:
  push:
    branches: [main]
    paths: ["charts/**", ".github/workflows/chart.yml"]
  pull_request:
    paths: ["charts/**", ".github/workflows/chart.yml"]

permissions:
  contents: read

jobs:
  chart:
    name: helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and render the chart
        run: charts/test.sh
